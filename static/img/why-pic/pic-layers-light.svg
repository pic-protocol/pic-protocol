<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 288" role="img" aria-label="How OIDC/OID4VP, the OAuth and PIC stack up across hops" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="mMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9bb3aa"/>
    </marker>
    <marker id="mAcc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00543d"/>
    </marker>
  </defs>

  <!-- layer cards -->
  <g>
    <rect x="24" y="40" width="224" height="96" rx="14" fill="#ffffff" stroke="#d5e2dc" stroke-width="1.5"/>
    <text x="136" y="78" text-anchor="middle" font-size="21" font-weight="700" fill="#00543d">OIDC / OID4VP</text>
    <text x="136" y="108" text-anchor="middle" font-size="13" fill="#5b6b64">Identity &amp; evidence</text>

    <rect x="328" y="40" width="224" height="96" rx="14" fill="#ffffff" stroke="#d5e2dc" stroke-width="1.5"/>
    <text x="440" y="78" text-anchor="middle" font-size="21" font-weight="700" fill="#00543d">OAuth</text>
    <text x="440" y="101" text-anchor="middle" font-size="13" fill="#16211d">Access token</text>
    <text x="440" y="119" text-anchor="middle" font-size="13" fill="#5b6b64">initial authority</text>

    <rect x="632" y="40" width="224" height="96" rx="14" fill="#eaf3ef" stroke="#00543d" stroke-width="2"/>
    <text x="744" y="78" text-anchor="middle" font-size="21" font-weight="700" fill="#00543d">PIC</text>
    <text x="744" y="101" text-anchor="middle" font-size="12.5" fill="#16211d">Proof of Relationship</text>
    <text x="744" y="119" text-anchor="middle" font-size="12.5" fill="#16211d">+ Proof of Continuity</text>
  </g>

  <!-- connectors between layers -->
  <line x1="252" y1="88" x2="322" y2="88" stroke="#9bb3aa" stroke-width="2" marker-end="url(#mMuted)"/>
  <line x1="556" y1="88" x2="626" y2="88" stroke="#9bb3aa" stroke-width="2" marker-end="url(#mMuted)"/>

  <!-- separator -->
  <line x1="24" y1="168" x2="856" y2="168" stroke="#d5e2dc" stroke-width="1"/>

  <!-- hop chain -->
  <text x="440" y="196" text-anchor="middle" font-size="13.5" font-weight="600" fill="#16211d">PIC carries that authority across every hop</text>

  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="173" y="214" width="54" height="26" rx="13" fill="#00543d"/><text x="200" y="231">PCA&#8320;</text>
    <rect x="333" y="214" width="54" height="26" rx="13" fill="#00543d"/><text x="360" y="231">PCA&#8321;</text>
    <rect x="493" y="214" width="54" height="26" rx="13" fill="#00543d"/><text x="520" y="231">PCA&#8322;</text>
    <rect x="653" y="214" width="54" height="26" rx="13" fill="#00543d"/><text x="680" y="231">PCA&#8345;</text>
  </g>
  <g stroke="#00543d" stroke-width="2">
    <line x1="229" y1="227" x2="331" y2="227" marker-end="url(#mAcc)"/>
    <line x1="389" y1="227" x2="491" y2="227" marker-end="url(#mAcc)"/>
    <line x1="549" y1="227" x2="622" y2="227" marker-end="url(#mAcc)"/>
    <line x1="622" y1="227" x2="651" y2="227" stroke-dasharray="3 4"/>
  </g>

  <text x="440" y="270" text-anchor="middle" font-size="12" fill="#5b6b64">each hop proves both — authority only narrows, never expands</text>
</svg>
