<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 348" role="img" aria-label="One untrusted executor hosting two execution occurrences, and which authority states a receiving boundary may or may not accept" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="nmA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5a54"/>
    </marker>
  </defs>

  <!-- left: one untrusted executor, two execution occurrences -->
  <rect x="24" y="44" width="492" height="252" rx="14" fill="#23262b" stroke="#33403b" stroke-width="1.5"/>
  <text x="44" y="70" font-size="10.5" font-weight="700" letter-spacing="1" fill="#9fb0a9">UNTRUSTED EXECUTOR E &#183; ONE PRINCIPAL</text>

  <rect x="44" y="107" width="92" height="30" rx="15" fill="#1c1f23" stroke="#33403b" stroke-width="1"/>
  <text x="90" y="126" text-anchor="middle" font-size="12" fill="#9fb0a9">Request A</text>
  <line x1="142" y1="122" x2="178" y2="122" stroke="#4a5a54" stroke-width="1.5" marker-end="url(#nmA)"/>
  <rect x="184" y="103" width="134" height="38" rx="9" fill="#1f2a27" stroke="#25c2a0" stroke-width="1.5"/>
  <text x="251" y="126" text-anchor="middle" font-size="12.5" font-weight="600" fill="#25c2a0">Execution A</text>
  <line x1="324" y1="122" x2="360" y2="122" stroke="#4a5a54" stroke-width="1.5" marker-end="url(#nmA)"/>
  <rect x="366" y="107" width="130" height="30" rx="15" fill="#1c1f23" stroke="#33403b" stroke-width="1"/>
  <text x="431" y="126" text-anchor="middle" font-size="11.5" fill="#e8efeb">Authority state A</text>

  <g text-anchor="middle" font-size="11" font-style="italic" fill="#9fb0a9">
    <text x="270" y="176">overlapping &#183; interleaved &#183; retained state</text>
    <text x="270" y="192">shared authority selection</text>
  </g>

  <rect x="44" y="223" width="92" height="30" rx="15" fill="#1c1f23" stroke="#33403b" stroke-width="1"/>
  <text x="90" y="242" text-anchor="middle" font-size="12" fill="#9fb0a9">Request B</text>
  <line x1="142" y1="238" x2="178" y2="238" stroke="#4a5a54" stroke-width="1.5" marker-end="url(#nmA)"/>
  <rect x="184" y="219" width="134" height="38" rx="9" fill="#1f2a27" stroke="#25c2a0" stroke-width="1.5"/>
  <text x="251" y="242" text-anchor="middle" font-size="12.5" font-weight="600" fill="#25c2a0">Execution B</text>
  <line x1="324" y1="238" x2="360" y2="238" stroke="#4a5a54" stroke-width="1.5" marker-end="url(#nmA)"/>
  <rect x="366" y="223" width="130" height="30" rx="15" fill="#1c1f23" stroke="#33403b" stroke-width="1"/>
  <text x="431" y="242" text-anchor="middle" font-size="11.5" fill="#e8efeb">Authority state B</text>

  <!-- right, top: locally attributable -->
  <rect x="540" y="44" width="316" height="100" rx="12" fill="#1f2a27" stroke="#2f4b43" stroke-width="1.5"/>
  <text x="558" y="70" font-size="10.5" font-weight="700" letter-spacing="1" fill="#25c2a0">LOCALLY ATTRIBUTABLE</text>
  <g stroke="#25c2a0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M558 96 l4 4 l8 -9"/>
    <path d="M558 122 l4 4 l8 -9"/>
  </g>
  <g font-size="12" fill="#e8efeb">
    <text x="580" y="100">Execution A</text>
    <text x="704" y="100">State A</text>
    <text x="580" y="126">Execution B</text>
    <text x="704" y="126">State B</text>
  </g>
  <g stroke="#4a5a54" stroke-width="1.5">
    <line x1="658" y1="96" x2="694" y2="96" marker-end="url(#nmA)"/>
    <line x1="658" y1="122" x2="694" y2="122" marker-end="url(#nmA)"/>
  </g>

  <!-- right, bottom: not acceptable without a verified relationship -->
  <rect x="540" y="160" width="316" height="136" rx="12" fill="#23262b" stroke="#33403b" stroke-width="1.5"/>
  <text x="558" y="186" font-size="10.5" font-weight="700" letter-spacing="1" fill="#f0836a">MUST NOT BE ACCEPTED UNVERIFIED</text>
  <g stroke="#f0836a" stroke-width="2" stroke-linecap="round">
    <path d="M558 212 l11 11 M569 212 l-11 11"/>
    <path d="M558 240 l11 11 M569 240 l-11 11"/>
    <path d="M558 268 l11 11 M569 268 l-11 11"/>
  </g>
  <g font-size="12" fill="#e8efeb">
    <text x="580" y="222">Execution A</text>
    <text x="704" y="222">State B</text>
    <text x="580" y="250">Execution B</text>
    <text x="704" y="250">State A</text>
    <text x="580" y="278">Execution A</text>
    <text x="704" y="278">State A + State B</text>
  </g>
  <g stroke="#4a5a54" stroke-width="1.5">
    <line x1="658" y1="218" x2="694" y2="218" marker-end="url(#nmA)"/>
    <line x1="658" y1="246" x2="694" y2="246" marker-end="url(#nmA)"/>
    <line x1="658" y1="274" x2="694" y2="274" marker-end="url(#nmA)"/>
  </g>

  <!-- footer -->
  <line x1="24" y1="312" x2="856" y2="312" stroke="#33403b" stroke-width="1"/>
  <text x="440" y="332" text-anchor="middle" font-size="12.5" fill="#9fb0a9">Their invalidity cannot be established by assuming the executor separates its own contexts.</text>
</svg>
