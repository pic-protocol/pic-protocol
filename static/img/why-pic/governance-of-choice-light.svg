<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" role="img" aria-label="The governance of choice: authorization protocol, freedom of choice, and supervised choice" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <!-- 1. Authorization protocol (the layer PIC addresses) -->
  <rect x="24" y="28" width="264" height="190" rx="14" fill="#eaf3ef" stroke="#00543d" stroke-width="2"/>
  <text x="156" y="62" text-anchor="middle" font-size="17" font-weight="700" fill="#00543d">Authorization protocol</text>
  <rect x="100" y="78" width="112" height="22" rx="11" fill="#00543d"/>
  <text x="156" y="93.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.3">Non-negotiable</text>
  <line x1="136" y1="112" x2="176" y2="112" stroke="#b9d2c8" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="12.5" fill="#16211d">
    <text x="156" y="132">A receiving boundary must not</text>
    <text x="156" y="150">accept authority that is not</text>
    <text x="156" y="168">validly attributable to the</text>
    <text x="156" y="186">execution being continued.</text>
  </g>

  <!-- 2. Freedom of choice -->
  <rect x="308" y="28" width="264" height="190" rx="14" fill="#ffffff" stroke="#d5e2dc" stroke-width="1.5"/>
  <text x="440" y="62" text-anchor="middle" font-size="17" font-weight="700" fill="#00543d">Freedom of choice</text>
  <rect x="380" y="78" width="120" height="22" rx="11" fill="#e3ece8"/>
  <text x="440" y="93.5" text-anchor="middle" font-size="11" font-weight="700" fill="#00543d" letter-spacing="0.3">Maximize safely</text>
  <line x1="420" y1="112" x2="460" y2="112" stroke="#d5e2dc" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="12.5" fill="#5b6b64">
    <text x="440" y="132">Give the executor as much</text>
    <text x="440" y="150">autonomy as can be verified</text>
    <text x="440" y="168">under the applicable policy</text>
    <text x="440" y="186">and execution context.</text>
  </g>

  <!-- 3. Supervised choice -->
  <rect x="592" y="28" width="264" height="190" rx="14" fill="#ffffff" stroke="#d5e2dc" stroke-width="1.5"/>
  <text x="724" y="62" text-anchor="middle" font-size="17" font-weight="700" fill="#00543d">Supervised choice</text>
  <rect x="664" y="78" width="120" height="22" rx="11" fill="#e3ece8"/>
  <text x="724" y="93.5" text-anchor="middle" font-size="11" font-weight="700" fill="#00543d" letter-spacing="0.3">Use when needed</text>
  <line x1="704" y1="112" x2="744" y2="112" stroke="#d5e2dc" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="12.5" fill="#5b6b64">
    <text x="724" y="132">Return the decision to the user</text>
    <text x="724" y="150">when the correct continuation</text>
    <text x="724" y="168">cannot be established with</text>
    <text x="724" y="186">sufficient precision.</text>
  </g>

  <!-- footer -->
  <line x1="24" y1="240" x2="856" y2="240" stroke="#d5e2dc" stroke-width="1"/>
  <text x="440" y="262" text-anchor="middle" font-size="12.5" fill="#5b6b64">PIC addresses the <tspan font-weight="700" fill="#00543d">authorization protocol</tspan>. Product and user-experience design govern the remaining two.</text>
</svg>
