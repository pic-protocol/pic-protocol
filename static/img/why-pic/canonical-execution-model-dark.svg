<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" role="img" aria-label="Executor n acts at time x, while executor n+1 is only provisioned at time x plus a positive offset and does not exist yet" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ceA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5a54"/>
    </marker>
  </defs>

  <!-- time badges -->
  <rect x="371" y="30" width="80" height="22" rx="11" fill="#1f2a27" stroke="#2f4b43" stroke-width="1"/>
  <text x="411" y="45.5" text-anchor="middle" font-size="11" font-weight="600" fill="#25c2a0">time x</text>
  <rect x="696" y="30" width="100" height="22" rx="11" fill="#1e2124" stroke="#33403b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="746" y="45.5" text-anchor="middle" font-size="11" font-weight="600" fill="#9fb0a9">time x + y</text>

  <!-- executor n-1 -->
  <rect x="24" y="70" width="210" height="76" rx="10" fill="#23262b" stroke="#33403b" stroke-width="1.5"/>
  <text x="129" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#e8efeb">Executor n&#8722;1</text>
  <text x="129" y="122" text-anchor="middle" font-size="10.5" fill="#9fb0a9">has already acted</text>

  <line x1="240" y1="108" x2="300" y2="108" stroke="#4a5a54" stroke-width="1.5" marker-end="url(#ceA)"/>

  <!-- executor n -->
  <rect x="306" y="70" width="210" height="76" rx="10" fill="#1f2a27" stroke="#25c2a0" stroke-width="2"/>
  <text x="411" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#25c2a0">Executor n</text>
  <text x="411" y="122" text-anchor="middle" font-size="10.5" fill="#e8efeb">acts now, and must emit</text>

  <line x1="522" y1="108" x2="630" y2="108" stroke="#4a5a54" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ceA)"/>
  <text x="576" y="100" text-anchor="middle" font-size="10" font-style="italic" fill="#9fb0a9">toward whom?</text>

  <!-- executor n+1 -->
  <rect x="636" y="70" width="220" height="76" rx="10" fill="#23262b" stroke="#4a5a54" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="746" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#9fb0a9">Executor n+1</text>
  <text x="746" y="122" text-anchor="middle" font-size="10.5" fill="#9fb0a9">not provisioned yet</text>

  <!-- footer -->
  <line x1="24" y1="180" x2="856" y2="180" stroke="#33403b" stroke-width="1"/>
  <text x="440" y="200" text-anchor="middle" font-size="12.5" fill="#9fb0a9">The successor materializes at <tspan font-style="italic" fill="#e8efeb">x + y</tspan>, where <tspan font-style="italic" fill="#e8efeb">y</tspan> is a positive offset &#8212; it does not exist when its predecessor acts.</text>
  <text x="440" y="220" text-anchor="middle" font-size="12.5" fill="#9fb0a9">There is no identity to delegate to. Only a <tspan font-weight="700" fill="#25c2a0">continuation</tspan> can be emitted.</text>
</svg>
