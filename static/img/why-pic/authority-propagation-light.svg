<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 314" role="img" aria-label="A permissioned entity forms an intent that creates the origin authority context, carried as a PCA across the executor chain, narrowing at every step" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="apA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9bb3aa"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="10" font-weight="700" letter-spacing="1" fill="#5b6b64">HOW AUTHORITY IS CREATED</text>

  <!-- 1. permissioned entity -->
  <rect x="24" y="44" width="216" height="88" rx="12" fill="#ffffff" stroke="#d5e2dc" stroke-width="1.5"/>
  <text x="132" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#16211d">Permissioned entity</text>
  <text x="132" y="97" text-anchor="middle" font-size="10.5" fill="#5b6b64">human &#183; workload &#183; service &#183; agent</text>
  <text x="132" y="114" text-anchor="middle" font-size="10.5" fill="#5b6b64">holds a set of permissions</text>

  <line x1="246" y1="88" x2="296" y2="88" stroke="#9bb3aa" stroke-width="1.5" marker-end="url(#apA)"/>
  <text x="271" y="80" text-anchor="middle" font-size="10" font-style="italic" fill="#5b6b64">forms</text>

  <!-- 2. intent -->
  <rect x="302" y="44" width="272" height="88" rx="12" fill="#ffffff" stroke="#d5e2dc" stroke-width="1.5"/>
  <text x="438" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#16211d">Intent</text>
  <text x="438" y="97" text-anchor="middle" font-size="10.5" fill="#5b6b64">selects a subset of those permissions</text>
  <text x="438" y="114" text-anchor="middle" font-size="10.5" fill="#5b6b64">and defines execution characteristics</text>

  <line x1="580" y1="88" x2="630" y2="88" stroke="#9bb3aa" stroke-width="1.5" marker-end="url(#apA)"/>
  <text x="605" y="80" text-anchor="middle" font-size="10" font-style="italic" fill="#5b6b64">creates</text>

  <!-- 3. PCA / origin authority -->
  <rect x="636" y="44" width="220" height="88" rx="12" fill="#eaf3ef" stroke="#00543d" stroke-width="2"/>
  <text x="746" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#00543d">PCA</text>
  <text x="746" y="97" text-anchor="middle" font-size="10.5" fill="#16211d">the origin authority context</text>
  <text x="746" y="114" text-anchor="middle" font-size="10.5" fill="#5b6b64">bounds everything downstream</text>

  <line x1="24" y1="160" x2="856" y2="160" stroke="#d5e2dc" stroke-width="1"/>
  <text x="24" y="186" font-size="10" font-weight="700" letter-spacing="1" fill="#5b6b64">HOW AUTHORITY TRAVELS</text>

  <!-- executor chain -->
  <rect x="24" y="200" width="200" height="64" rx="10" fill="#ffffff" stroke="#d5e2dc" stroke-width="1.5"/>
  <text x="124" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#16211d">Executor n&#8722;1</text>
  <text x="124" y="245" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1" fill="#5b6b64">UPSTREAM</text>

  <line x1="228" y1="232" x2="240" y2="232" stroke="#9bb3aa" stroke-width="1.5"/>
  <rect x="244" y="218" width="76" height="28" rx="14" fill="#eaf3ef" stroke="#00543d" stroke-width="1.5"/>
  <text x="282" y="237" text-anchor="middle" font-size="11.5" font-weight="700" fill="#00543d">PCA</text>
  <line x1="324" y1="232" x2="336" y2="232" stroke="#9bb3aa" stroke-width="1.5" marker-end="url(#apA)"/>

  <rect x="340" y="200" width="200" height="64" rx="10" fill="#ffffff" stroke="#d5e2dc" stroke-width="1.5"/>
  <text x="440" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#16211d">Executor n</text>
  <text x="440" y="245" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1" fill="#00543d">CURRENT</text>

  <line x1="544" y1="232" x2="556" y2="232" stroke="#9bb3aa" stroke-width="1.5"/>
  <rect x="560" y="218" width="76" height="28" rx="14" fill="#eaf3ef" stroke="#00543d" stroke-width="1.5"/>
  <text x="598" y="237" text-anchor="middle" font-size="11.5" font-weight="700" fill="#00543d">PCA</text>
  <line x1="640" y1="232" x2="652" y2="232" stroke="#9bb3aa" stroke-width="1.5" marker-end="url(#apA)"/>

  <rect x="656" y="200" width="200" height="64" rx="10" fill="#ffffff" stroke="#d5e2dc" stroke-width="1.5"/>
  <text x="756" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#16211d">Executor n+1</text>
  <text x="756" y="245" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1" fill="#5b6b64">DOWNSTREAM</text>

  <!-- narrowing authority bars -->
  <rect x="44" y="274" width="160" height="6" rx="3" fill="#00543d"/>
  <rect x="380" y="274" width="120" height="6" rx="3" fill="#00543d"/>
  <rect x="714" y="274" width="84" height="6" rx="3" fill="#00543d"/>

  <text x="440" y="302" text-anchor="middle" font-size="12.5" fill="#5b6b64">Every step carries forward a <tspan font-weight="700" fill="#00543d">subset</tspan> of what it received &#8212; authority can only narrow.</text>
</svg>
