<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" role="img" aria-label="Two independently valid lineages are attenuated correctly, then a bug composes authority from both into one state presented as a single continuation" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="bvA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9bb3aa"/>
    </marker>
  </defs>

  <!-- lineage 1 -->
  <text x="24" y="100" font-size="10" font-weight="700" letter-spacing="1" fill="#0b6b7d">LINEAGE 1</text>
  <rect x="110" y="62" width="156" height="68" rx="10" fill="#ffffff" stroke="#d5e2dc" stroke-width="1.5"/>
  <rect x="122" y="72" width="132" height="24" rx="6" fill="#e6f6fa" stroke="#a9dfe9" stroke-width="1"/>
  <text x="188" y="88.5" text-anchor="middle" font-size="11.5" fill="#0b6b7d">read foo</text>
  <rect x="122" y="100" width="132" height="24" rx="6" fill="#e6f6fa" stroke="#a9dfe9" stroke-width="1"/>
  <text x="188" y="116.5" text-anchor="middle" font-size="11.5" fill="#0b6b7d">share files</text>

  <line x1="272" y1="96" x2="344" y2="96" stroke="#9bb3aa" stroke-width="1.5" marker-end="url(#bvA)"/>
  <text x="308" y="88" text-anchor="middle" font-size="10" font-style="italic" fill="#5b6b64">attenuation</text>

  <rect x="350" y="62" width="156" height="68" rx="10" fill="#ffffff" stroke="#d5e2dc" stroke-width="1.5"/>
  <rect x="362" y="84" width="132" height="24" rx="6" fill="#e6f6fa" stroke="#a9dfe9" stroke-width="1"/>
  <text x="428" y="100.5" text-anchor="middle" font-size="11.5" fill="#0b6b7d">share files</text>

  <!-- lineage 2 -->
  <text x="24" y="270" font-size="10" font-weight="700" letter-spacing="1" fill="#00543d">LINEAGE 2</text>
  <rect x="110" y="232" width="156" height="68" rx="10" fill="#ffffff" stroke="#d5e2dc" stroke-width="1.5"/>
  <rect x="122" y="242" width="132" height="24" rx="6" fill="#eaf3ef" stroke="#b9d2c8" stroke-width="1"/>
  <text x="188" y="258.5" text-anchor="middle" font-size="11.5" fill="#00543d">read all</text>
  <rect x="122" y="270" width="132" height="24" rx="6" fill="#eaf3ef" stroke="#b9d2c8" stroke-width="1"/>
  <text x="188" y="286.5" text-anchor="middle" font-size="11.5" fill="#00543d">backup</text>

  <line x1="272" y1="266" x2="344" y2="266" stroke="#9bb3aa" stroke-width="1.5" marker-end="url(#bvA)"/>
  <text x="308" y="258" text-anchor="middle" font-size="10" font-style="italic" fill="#5b6b64">attenuation</text>

  <rect x="350" y="232" width="156" height="68" rx="10" fill="#ffffff" stroke="#d5e2dc" stroke-width="1.5"/>
  <rect x="362" y="254" width="132" height="24" rx="6" fill="#eaf3ef" stroke="#b9d2c8" stroke-width="1"/>
  <text x="428" y="270.5" text-anchor="middle" font-size="11.5" fill="#00543d">read all</text>

  <!-- the bug composes both -->
  <path d="M506 96 C 566 96, 580 165, 628 165" fill="none" stroke="#9bb3aa" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#bvA)"/>
  <path d="M506 266 C 566 266, 580 199, 628 199" fill="none" stroke="#9bb3aa" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#bvA)"/>
  <text x="568" y="186" text-anchor="middle" font-size="10.5" font-style="italic" fill="#a8412a">a bug composes them</text>

  <!-- composed state -->
  <g stroke="#a8412a" stroke-width="2" stroke-linecap="round">
    <path d="M636 128 l11 11 M647 128 l-11 11"/>
  </g>
  <text x="657" y="139" font-size="10" font-weight="700" letter-spacing="1" fill="#a8412a">MUST NOT BE ACCEPTED</text>
  <rect x="636" y="147" width="220" height="78" rx="10" fill="#ffffff" stroke="#a8412a" stroke-width="2"/>
  <rect x="652" y="159" width="188" height="26" rx="6" fill="#eaf3ef" stroke="#b9d2c8" stroke-width="1"/>
  <text x="746" y="176.5" text-anchor="middle" font-size="11.5" fill="#00543d">read all</text>
  <rect x="652" y="191" width="188" height="26" rx="6" fill="#e6f6fa" stroke="#a9dfe9" stroke-width="1"/>
  <text x="746" y="208.5" text-anchor="middle" font-size="11.5" fill="#0b6b7d">share files</text>
  <text x="730" y="242" text-anchor="middle" font-size="10" fill="#5b6b64">presented to executor n+1 as one continuation</text>

  <!-- footer -->
  <line x1="24" y1="314" x2="856" y2="314" stroke="#d5e2dc" stroke-width="1"/>
  <text x="440" y="334" text-anchor="middle" font-size="12.5" fill="#5b6b64">Every artifact is valid and every attenuation is correct &#8212; what is missing is <tspan font-weight="700" fill="#00543d">lineage attribution</tspan>.</text>
</svg>
