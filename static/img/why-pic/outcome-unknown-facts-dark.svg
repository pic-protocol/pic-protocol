<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 328" role="img" aria-label="A signed predicate waits while an unknown outcome appears at runtime, then evidence is checked before a signed bounded result is issued" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="oufA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5a54"/>
    </marker>
  </defs>

  <!-- time badges -->
  <rect x="82" y="28" width="118" height="22" rx="11" fill="#1f2a27" stroke="#2f4b43" stroke-width="1"/>
  <text x="141" y="43.5" text-anchor="middle" font-size="11" font-weight="600" fill="#25c2a0">signing time</text>
  <rect x="394" y="28" width="132" height="22" rx="11" fill="#1e2124" stroke="#33403b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="460" y="43.5" text-anchor="middle" font-size="11" font-weight="600" fill="#9fb0a9">runtime fact appears</text>
  <rect x="696" y="28" width="120" height="22" rx="11" fill="#1f2a27" stroke="#2f4b43" stroke-width="1"/>
  <text x="756" y="43.5" text-anchor="middle" font-size="11" font-weight="600" fill="#25c2a0">commit time</text>

  <!-- signed predicate -->
  <rect x="24" y="74" width="230" height="120" rx="10" fill="#23262b" stroke="#33403b" stroke-width="1.5"/>
  <text x="139" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#25c2a0">Signed predicate</text>
  <text x="139" y="121" text-anchor="middle" font-size="10.5" fill="#9fb0a9">authority before the fact exists</text>
  <rect x="50" y="138" width="178" height="22" rx="6" fill="#1f2a27" stroke="#2f4b43" stroke-width="1"/>
  <text x="139" y="153.5" text-anchor="middle" font-size="11" fill="#25c2a0">task bounds</text>
  <rect x="50" y="164" width="178" height="22" rx="6" fill="#16323a" stroke="#24525e" stroke-width="1"/>
  <text x="139" y="179.5" text-anchor="middle" font-size="11" fill="#4cc7dd">conditional cases</text>

  <line x1="266" y1="134" x2="338" y2="134" stroke="#4a5a54" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#oufA)"/>
  <text x="302" y="126" text-anchor="middle" font-size="10" font-style="italic" fill="#9fb0a9">not known yet</text>

  <!-- outcome appears -->
  <rect x="346" y="74" width="188" height="120" rx="10" fill="#23262b" stroke="#4a5a54" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="440" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#9fb0a9">Outcome n+1</text>
  <text x="440" y="121" text-anchor="middle" font-size="10.5" fill="#9fb0a9">created by the world</text>
  <rect x="370" y="138" width="140" height="22" rx="6" fill="#1e2124" stroke="#33403b" stroke-width="1"/>
  <text x="440" y="153.5" text-anchor="middle" font-size="11" fill="#9fb0a9">new option</text>
  <rect x="370" y="164" width="140" height="22" rx="6" fill="#1e2124" stroke="#33403b" stroke-width="1"/>
  <text x="440" y="179.5" text-anchor="middle" font-size="11" fill="#9fb0a9">runtime evidence</text>

  <line x1="546" y1="134" x2="618" y2="134" stroke="#4a5a54" stroke-width="1.5" marker-end="url(#oufA)"/>
  <text x="582" y="126" text-anchor="middle" font-size="10" font-style="italic" fill="#9fb0a9">prove it</text>

  <!-- evidence check -->
  <rect x="626" y="74" width="230" height="120" rx="10" fill="#1f2a27" stroke="#25c2a0" stroke-width="2"/>
  <text x="741" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#25c2a0">Guardrail at commit</text>
  <text x="741" y="121" text-anchor="middle" font-size="10.5" fill="#e8efeb">checks evidence against intent</text>
  <rect x="652" y="138" width="178" height="22" rx="6" fill="#23262b" stroke="#2f4b43" stroke-width="1"/>
  <text x="741" y="153.5" text-anchor="middle" font-size="11" fill="#25c2a0">predicate matches</text>
  <rect x="652" y="164" width="178" height="22" rx="6" fill="#23262b" stroke="#2f4b43" stroke-width="1"/>
  <text x="741" y="179.5" text-anchor="middle" font-size="11" fill="#25c2a0">one signed case closes</text>

  <!-- signed result -->
  <path d="M741 196 C741 218, 610 218, 580 238" fill="none" stroke="#4a5a54" stroke-width="1.5" marker-end="url(#oufA)"/>
  <rect x="244" y="232" width="392" height="62" rx="10" fill="#23262b" stroke="#25c2a0" stroke-width="2"/>
  <text x="440" y="257" text-anchor="middle" font-size="14" font-weight="700" fill="#25c2a0">Signed bounded decision result</text>
  <text x="440" y="278" text-anchor="middle" font-size="11.5" fill="#9fb0a9">the granted outcome becomes the next PIC authority context</text>

  <!-- footer -->
  <line x1="24" y1="310" x2="856" y2="310" stroke="#33403b" stroke-width="1"/>
  <text x="440" y="324" text-anchor="middle" font-size="12.5" fill="#9fb0a9">Authority comes from a signed predicate plus proven runtime facts, not from an agent guess.</text>
</svg>
